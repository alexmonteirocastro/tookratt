name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  # Required so the reusable ci.yml workflow may request pull-requests: write
  # (caller cannot grant less than the callee asks). The PR comment no-ops on
  # push-to-main; the report still uploads to tookratt-playwright-reports.
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
