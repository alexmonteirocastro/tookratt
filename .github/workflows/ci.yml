name: CI

on:
  workflow_call:
    inputs:
      skip_heavy_tests:
        description: >-
          When true (docs-only PRs), unit/frontend/retrieval jobs no-op with
          a success status so branch-protection required checks still pass.
          deploy.yml omits this input — main always runs the full suite.
        type: boolean
        required: false
        default: false
      run_visual_tests:
        description: >-
          When false, skip Playwright visual snapshots (no frontend/ changes
          on the PR). Smoke still runs. deploy.yml omits this — main always
          runs visuals.
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Skipping checks (docs-only PR)
        if: inputs.skip_heavy_tests
        run: echo "Skipping checks (docs-only PR)"

      - uses: actions/checkout@v4
        if: ${{ !inputs.skip_heavy_tests }}

      - uses: astral-sh/setup-uv@v5
        if: ${{ !inputs.skip_heavy_tests }}
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ !inputs.skip_heavy_tests }}
        run: uv sync --frozen --group dev

      - name: Run backend lint
        if: ${{ !inputs.skip_heavy_tests }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run backend type check
        if: ${{ !inputs.skip_heavy_tests }}
        run: uv run mypy .

      - name: Run unit tests
        if: ${{ !inputs.skip_heavy_tests }}
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION_NAME: JOBS_ON_THE_HUB
          EMBEDDING_MODEL: intfloat/multilingual-e5-small
          TOOKRATT_API_KEYS: test-api-key
        run: uv run pytest -v -m "not retrieval and not generation"

  retrieval-test:
    # ADR-0014: E5 has no local FastEmbed path — eval tests hit Qdrant Cloud and
    # drop/re-seed JOBS_DEV on every run (Cloud Inference token usage). Avoid
    # manual --seed-dev against the same cluster while CI is running.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-retrieval
      cancel-in-progress: true
    steps:
      - name: Skipping checks (docs-only PR)
        if: inputs.skip_heavy_tests
        run: echo "Skipping checks (docs-only PR)"

      - uses: actions/checkout@v4
        if: ${{ !inputs.skip_heavy_tests }}

      - uses: astral-sh/setup-uv@v5
        if: ${{ !inputs.skip_heavy_tests }}
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ !inputs.skip_heavy_tests }}
        run: uv sync --frozen --group dev

      - name: Run retrieval and generation eval tests
        if: ${{ !inputs.skip_heavy_tests }}
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION_NAME: ${{ secrets.QDRANT_COLLECTION_NAME }}
          QDRANT_DEV_COLLECTION_NAME: JOBS_DEV
          EMBEDDING_MODEL: intfloat/multilingual-e5-small
          TOOKRATT_API_KEYS: test-api-key
        run: uv run pytest -v -m "retrieval or generation"

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-frontend
      cancel-in-progress: true
    steps:
      - name: Skipping checks (docs-only PR)
        if: inputs.skip_heavy_tests
        run: echo "Skipping checks (docs-only PR)"

      - uses: actions/checkout@v4
        if: ${{ !inputs.skip_heavy_tests }}

      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_heavy_tests }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: frontend
        run: npm run lint

  playwright:
    # ADR-0017: Chromium-only E2E smoke (blocking) + visual snapshots
    # (artifact-only; diffs do not fail the job).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-playwright
      cancel-in-progress: true
    steps:
      - name: Skipping checks (docs-only PR)
        if: inputs.skip_heavy_tests
        run: echo "Skipping checks (docs-only PR)"

      - uses: actions/checkout@v4
        if: ${{ !inputs.skip_heavy_tests }}

      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_heavy_tests }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        if: ${{ !inputs.skip_heavy_tests }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: frontend
        env:
          PLAYWRIGHT_VISUAL: "0"
        run: npx playwright test --grep @smoke

      - name: Skipping visual snapshots (no frontend changes)
        if: ${{ !inputs.skip_heavy_tests && !inputs.run_visual_tests }}
        run: echo "Skipping visual snapshots (no frontend/ changes)"

      - name: Run visual snapshot tests
        id: visual
        if: ${{ !inputs.skip_heavy_tests && inputs.run_visual_tests }}
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test --grep @visual --retries=0

      - name: Collect visual diff images
        if: ${{ always() && !inputs.skip_heavy_tests && (steps.visual.outcome == 'success' || steps.visual.outcome == 'failure') }}
        working-directory: frontend
        run: |
          mkdir -p visual-diffs
          find test-results -type f \( \
            -name '*-diff.png' -o -name '*-actual.png' -o -name '*-expected.png' \
          \) -exec cp {} visual-diffs/ \; || true
          ls -la visual-diffs || true

      - name: Upload Playwright HTML report
        if: ${{ always() && !inputs.skip_heavy_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload visual diff images
        if: ${{ always() && !inputs.skip_heavy_tests && (steps.visual.outcome == 'success' || steps.visual.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: frontend/visual-diffs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy Playwright report to Cloudflare Pages
        id: pages
        if: ${{ always() && !inputs.skip_heavy_tests && (steps.visual.outcome == 'success' || steps.visual.outcome == 'failure') && secrets.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy frontend/playwright-report
            --project-name=tookratt-playwright-reports
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment visual results on PR
        if: ${{ always() && !inputs.skip_heavy_tests && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- playwright-visual-report -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const visualRequested = ${{ inputs.run_visual_tests }};
            // outcome, not conclusion: continue-on-error rewrites conclusion to success.
            const visualOutcome = '${{ steps.visual.outcome }}';
            const hostedReport =
              '${{ steps.pages.outputs.pages-deployment-alias-url }}'.trim() ||
              '${{ steps.pages.outputs.deployment-url }}'.trim();
            const reportLink = hostedReport
              ? `[Playwright HTML report](${hostedReport})`
              : `[this run's \`playwright-report\` artifact](${runUrl})`;
            const diffsDir = 'frontend/visual-diffs';
            let diffFiles = [];
            if (fs.existsSync(diffsDir)) {
              diffFiles = fs.readdirSync(diffsDir).filter((name) => name.endsWith('-diff.png')).sort();
            }

            let body = `${marker}\n## Playwright visual snapshots\n\n`;
            if (!visualRequested) {
              body += 'Skipped — no `frontend/` changes on this PR.\n';
            } else if (visualOutcome !== 'success' && visualOutcome !== 'failure') {
              body += `Visual tests did not run (earlier step failed or was cancelled). See [this run](${runUrl}).\n`;
            } else if (diffFiles.length > 0) {
              body += `${diffFiles.length} snapshot(s) differed (often local vs CI font rendering — ADR-0017). `;
              body += `Open the ${reportLink} for side-by-side diffs and traces.\n\n`;
              body += diffFiles.map((name) => `- \`${name}\``).join('\n');
              body += '\n';
            } else if (visualOutcome === 'success') {
              body += `No pixel diffs. See ${reportLink}.\n`;
            } else {
              body += `Visual tests failed before producing snapshot diffs (install, timeout, or crash). See [this run](${runUrl}).\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  marketing-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-marketing
      cancel-in-progress: true
    steps:
      - name: Skipping checks (docs-only PR)
        if: inputs.skip_heavy_tests
        run: echo "Skipping checks (docs-only PR)"

      - uses: actions/checkout@v4
        if: ${{ !inputs.skip_heavy_tests }}

      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_heavy_tests }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: marketing
        run: npm ci

      - name: Run marketing lint
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: marketing
        run: npm run lint

      - name: Run marketing build
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: marketing
        run: npm run build

  capture-worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-capture-worker
      cancel-in-progress: true
    steps:
      - name: Skipping checks (docs-only PR)
        if: inputs.skip_heavy_tests
        run: echo "Skipping checks (docs-only PR)"

      - uses: actions/checkout@v4
        if: ${{ !inputs.skip_heavy_tests }}

      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_heavy_tests }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/capture/package-lock.json

      - name: Install dependencies
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: workers/capture
        run: npm ci

      - name: Typecheck capture Worker
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: workers/capture
        run: npm run typecheck

      - name: Test capture Worker
        if: ${{ !inputs.skip_heavy_tests }}
        working-directory: workers/capture
        run: npm test

  markdown-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-markdown-links
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir . --verbose --no-progress './**/*.md'
