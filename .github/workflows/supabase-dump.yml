name: Supabase dump

# ALE-215 / ADR-0019: daily backup and keep-alive for the production Supabase
# project. The free tier has no backups and pauses after a quiet week. The API
# does not open SQL, so this job is what keeps the project awake.
#
# The session pooler URL (port 5432) comes from the dashboard Connect panel and
# is stored as SUPABASE_DB_URL. Do not hardcode the pooler host.
#
# Dumps go to the private R2 bucket tookratt-supabase-dumps (jurisdiction eu).
# auth is data only, without schema_migrations. public is schema and data.
# Uploads use the existing CLOUDFLARE_API_TOKEN. No separate R2 access key.

on:
  schedule:
    - cron: "15 1 * * *" # 01:15 UTC, after ingest.yml at midnight
  workflow_dispatch:
    inputs:
      bucket_only:
        description: Create the EU R2 bucket and stop
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ensure-bucket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-dump
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Create the private EU bucket
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset"
            exit 1
          fi
          if ! npx --yes wrangler@4 r2 bucket info tookratt-supabase-dumps --jurisdiction eu --json >/tmp/r2-info.json; then
            npx --yes wrangler@4 r2 bucket create tookratt-supabase-dumps --jurisdiction eu --update-config false
          fi
          npx --yes wrangler@4 r2 bucket lifecycle add tookratt-supabase-dumps expire-dumps dumps/ \
            --expire-days 30 --jurisdiction eu --force || echo "Lifecycle rule was already present"
          npx --yes wrangler@4 r2 bucket info tookratt-supabase-dumps --jurisdiction eu --json

  dump:
    needs: ensure-bucket
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.bucket_only == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set dump timestamp
        id: stamp
        run: echo "ts=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and upload
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAMP: ${{ steps.stamp.outputs.ts }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_DB_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAMP; do
            if [ -z "${!name}" ]; then
              echo "${name} is unset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          pg_bin=/usr/lib/postgresql/17/bin
          psql="${pg_bin}/psql"
          pg_dump="${pg_bin}/pg_dump"

          "$psql" "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "select 1" >/dev/null
          server_num=$("$psql" "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "show server_version_num")
          server_num=${server_num//[[:space:]]/}
          server_major=$((server_num / 10000))
          client_major=$("$pg_dump" --version | sed -n 's/.* \([0-9][0-9]*\)\..*/\1/p')
          if [ "$server_major" != "$client_major" ]; then
            echo "pg_dump major ${client_major} does not match server major ${server_major}"
            exit 1
          fi

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          "$pg_dump" "$SUPABASE_DB_URL" \
            --format=custom \
            --data-only \
            --no-owner \
            --no-acl \
            --schema=auth \
            --exclude-table-data=auth.schema_migrations \
            --file="$workdir/auth-data.dump"
          "$pg_dump" "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --schema=public \
            --file="$workdir/public.dump"

          prefix="dumps/${STAMP}"
          npx --yes wrangler@4 r2 object put "tookratt-supabase-dumps/${prefix}/auth-data.dump" \
            --file="$workdir/auth-data.dump" --remote --jurisdiction eu --force
          npx --yes wrangler@4 r2 object put "tookratt-supabase-dumps/${prefix}/public.dump" \
            --file="$workdir/public.dump" --remote --jurisdiction eu --force
          echo "Uploaded ${prefix}/auth-data.dump and ${prefix}/public.dump"

      - name: Record schedule heartbeat
        if: success()
        env:
          GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER_ID: ${{ secrets.GRAFANA_LOKI_USER_ID }}
          GRAFANA_LOKI_API_KEY: ${{ secrets.GRAFANA_LOKI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in GRAFANA_LOKI_URL GRAFANA_LOKI_USER_ID GRAFANA_LOKI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "${name} is unset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          now=$(date +%s%N)
          payload=$(printf '{"streams":[{"stream":{"app":"tookratt","event":"schedule_heartbeat","source":"supabase_dump"},"values":[["%s","supabase dump uploaded"]]}]}' "$now")
          code=$(curl --silent --show-error --output /tmp/loki-body --write-out "%{http_code}" \
            --user "${GRAFANA_LOKI_USER_ID}:${GRAFANA_LOKI_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            --url "$GRAFANA_LOKI_URL" || echo "000")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Loki push returned HTTP ${code}"
            exit 1
          fi
          echo "Loki heartbeat accepted"
