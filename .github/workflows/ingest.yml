name: Ingestion Sync

# ADR-0013 Decision 5: runs the existing sync command directly (no Docker Compose
# in production) against the production Qdrant Cloud cluster. Cadence must stay
# under 1 week or Decision 4's suspend-risk mitigation stops holding — daily is
# well under that ceiling (this ticket sets 24h from the start, rather than
# the README's original 6-hour cron example).

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC — well under the 1-week suspend-risk ceiling
  workflow_dispatch: {} # allows a manual run from the Actions tab (AC: "confirm one manual run succeeds")

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ingestion-sync
      cancel-in-progress: false
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION_NAME: ${{ secrets.QDRANT_COLLECTION_NAME }}
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      # Settings() requires API keys even though ingestion doesn't use /chat
      # auth — reuse the same production key(s) set on Render (ALE-168).
      # GHA exports missing secrets as "" (not unset), which would beat the
      # Settings AliasChoices fallback — resolve here so a missing
      # TOOKRATT_API_KEYS secret still uses HUBSTER_API_KEYS.
      TOOKRATT_API_KEYS: ${{ secrets.TOOKRATT_API_KEYS || secrets.HUBSTER_API_KEYS }}
      # ADR-0015: optional Loki push (omit or leave unset in secrets to skip).
      GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
      GRAFANA_LOKI_USER_ID: ${{ secrets.GRAFANA_LOKI_USER_ID }}
      GRAFANA_LOKI_API_KEY: ${{ secrets.GRAFANA_LOKI_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run incremental sync
        run: uv run python main.py
        # Sync (not --seed): diffs live listings vs Qdrant, adds new jobs,
        # removes delisted ones. Never drops the collection, so search stays
        # available throughout — safe to run unattended on a schedule.

      - name: Refresh tookratt.com market stats
        # ALE-209: the marketing Pages build fetches /jobs/stats from The Hub.
        # Those counts are not read from Qdrant, so this is a daily refresh,
        # not a picture of the index just synced. A failed hook must not fail the sync.
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK is unset; tookratt.com keeps its previous numbers"
            exit 1
          fi
          code=$(curl --silent --output /tmp/pages-hook-body --write-out "%{http_code}" \
            --request POST --url "$CLOUDFLARE_PAGES_DEPLOY_HOOK" || echo "000")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Marketing deploy hook returned HTTP ${code}"
            exit 1
          fi
          echo "Marketing deploy hook accepted"

      - name: Record schedule heartbeat
        # ALE-247. Ingest logs with print, so an absence rule cannot watch them.
        # A manual run must not reset the 36-hour window.
        if: success() && github.event_name == 'schedule'
        env:
          GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER_ID: ${{ secrets.GRAFANA_LOKI_USER_ID }}
          GRAFANA_LOKI_API_KEY: ${{ secrets.GRAFANA_LOKI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in GRAFANA_LOKI_URL GRAFANA_LOKI_USER_ID GRAFANA_LOKI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "${name} is unset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          now=$(date +%s%N)
          payload=$(printf '{"streams":[{"stream":{"app":"tookratt","event":"schedule_heartbeat","source":"ingest"},"values":[["%s","ingest schedule ran"]]}]}' "$now")
          code=$(curl --silent --show-error --output /tmp/loki-body --write-out "%{http_code}" \
            --user "${GRAFANA_LOKI_USER_ID}:${GRAFANA_LOKI_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            --url "$GRAFANA_LOKI_URL" || echo "000")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Loki push returned HTTP ${code}"
            exit 1
          fi
          echo "Loki heartbeat accepted"
